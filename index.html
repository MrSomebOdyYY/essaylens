<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EssayLens · 英文写作分析</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f5ef;color:#213b35;font:16px/1.6 "DM Sans",system-ui,sans-serif}
header,main,footer{max-width:1080px;margin:auto;padding:22px}
header{border-bottom:1px solid #ccd2c9;display:flex;align-items:center;justify-content:space-between}
.brand{font:bold 28px Georgia}
footer{border-top:1px solid #ccd2c9;color:#52665e;font-size:.9rem}
footer a{color:inherit}
#loadHint{display:block;margin:4px 0 12px}
#cancel{color:#224e41;background:transparent;border:1px solid #7c948b}
.actions{display:flex;gap:8px}
.option{display:flex;align-items:center;gap:7px;margin:10px 0;color:#314e44;cursor:pointer}
.option input{accent-color:#224e41;width:17px;height:17px}
h1{font:clamp(43px,7vw,80px)/1 Georgia;margin:36px 0 12px;letter-spacing:-.055em}
h2{margin:0;font-size:20px}
p{margin:8px 0 20px}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.grid{align-items:start}
section,aside{background:#fffefa;border:1px solid #d4d9cf;padding:24px;border-radius:12px}
aside{background:#173e35;color:#fff;border-color:#173e35}
aside p{color:#d1e1d6}
small{color:#52665e}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
textarea{resize:vertical;width:100%;height:290px;margin:12px 0;border:1px solid #becac0;border-radius:7px;padding:14px;font:17px/1.65 Georgia,serif;background:#fff}
button{cursor:pointer;font:inherit;background:#224e41;color:white;border:0;border-radius:6px;padding:8px 18px}
button:disabled{opacity:.55;cursor:wait}
.example{background:transparent;color:#285b48;text-decoration:underline;padding:4px}
#score{display:block;font:64px Georgia,serif;color:#d8eeac;margin:12px 0}
#summary:empty{display:none}
#verdict{margin:0 0 8px;color:#d8eeac}
.scoreNote{margin:14px 0 0;font-size:.9rem}
#sentenceResults{border-top:1px solid #57786c;margin-top:20px;padding-top:18px}
#sentenceResults h3{font-size:1.05rem;margin:0}
#sentenceList{list-style:none;padding:0;margin:12px 0 0}
#sentenceList li{border-left:3px solid #c2d99b;background:#224a3f;padding:9px 12px;margin-top:8px;font:17px/1.55 Georgia,serif;overflow-wrap:anywhere;white-space:pre-wrap}
#sentenceEmpty{margin:8px 0 0}
[hidden]{display:none!important}
@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:15px}section,aside{padding:18px}}
</style>
</head>
<body>
<header><b class="brand">EssayLens</b><small>浏览器本地分析 · 作文无需上传</small></header>
<main>
<h1>Essay analysis</h1>
<p>粘贴英文作文或短句，查看 AI率和模型标出的原句。</p>
<div class="grid">
  <section>
    <div class="row"><label for="essay"><strong>英文作文</strong></label><button class="example" id="sample">填入示例</button></div>
    <textarea spellcheck="false" maxlength="60000" id="essay" placeholder="Paste your essay here…"></textarea>
    <label class="option"><input type="checkbox" id="withSentences" checked>同时标出像 AI 写的句子（较慢）</label>
    <small id="loadHint">首次分析会下载约 1.74 GB 的模型。请预留至少 2 GB 浏览器存储空间，建议使用新版桌面 Edge 或 Chrome。下载后可重复使用。</small>
    <div class="row"><small id="count"></small><div class="actions"><button id="cancel" hidden>停止</button><button id="run">分析作文</button></div></div>
  </section>
  <aside aria-labelledby="scoreTitle">
    <h2 id="scoreTitle">AI率</h2>
    <output id="score" aria-labelledby="scoreTitle">—</output>
    <p id="verdict" hidden></p>
    <p id="summary" role="status"></p>
    <div id="sentenceResults" hidden>
      <h3>更像 AI 写的句子</h3>
      <ul id="sentenceList" lang="en"></ul>
      <p id="sentenceEmpty" hidden>没有句子达到 98% 的判定线。</p>
    </div>
    <p class="scoreNote">AI率是模型对全文的评分，不能换算成 AI 写了多少字。单句得分达到 98% 就会列出。</p>
  </aside>
</div>
</main>
<footer class="row"><span>由 OpenAI Codex 制作</span><span>检测模型 · <a href="https://huggingface.co/desklib/ai-text-detector-v1.01">Desklib v1.01</a></span></footer>
<script>
const get = id => document.getElementById(id);
const input = get('essay');
const words = text => text.match(/[a-z]+(?:['’-][a-z]+)*/gi) || [];
const threshold = 0.98;

function reset() {
  get('count').textContent = words(input.value).length + ' 个英文单词';
  get('score').textContent = '—';
  get('verdict').hidden = true;
  get('summary').textContent = '';
  get('sentenceResults').hidden = true;
  get('sentenceList').replaceChildren();
  get('sentenceEmpty').hidden = true;
}

function busy(value) {
  get('run').disabled = value;
  get('sample').disabled = value;
  get('withSentences').disabled = value;
  get('cancel').textContent = '停止';
  input.readOnly = value;
  get('cancel').hidden = !value;
}

const validScore = score => Number.isFinite(score) && score >= 0 && score <= 1;
function renderWhole(score) {
  if (!validScore(score)) throw new Error('未收到有效的全文分数。');
  const rounded = (100 * score).toFixed(1) + '%';
  get('score').textContent = score < threshold && rounded === '98.0%' ? '<98.0%' : rounded;
  get('verdict').textContent = score >= threshold ? '达到 98% 全文判定线' : '低于 98% 全文判定线';
  get('verdict').hidden = false;
}

function appendMatch(row, index) {
  if (row.score < threshold || !/[A-Za-z]/.test(row.text)) return;
  const item = document.createElement('li');
  item.textContent = row.text;
  item.dataset.index = index;
  const list = get('sentenceList');
  let left = 0, right = list.children.length;
  while (left < right) {
    const middle = Math.floor((left + right) / 2);
    if (Number(list.children[middle].dataset.index) < index) left = middle + 1;
    else right = middle;
  }
  list.insertBefore(item, list.children[left] || null);
  get('sentenceResults').hidden = false;
}

input.oninput = reset;
get('sample').onclick = () => {
  if (input.value.trim() && !confirm('用示例替换当前作文？')) return;
  input.value = 'In my neighborhood, the last evening bus leaves before the library closes. In my neighborhood, that single hour determines who can stay for the free classes. On Tuesday I watched two students pack their books halfway through a lesson and run for the stop. In conclusion, moving the final departure back by an hour would let both students finish class and still get home.\n\nThe timetable alone cannot tell the council how many students would take a later bus. I would start with a Thursday trial and ask the librarian to keep a count of the people who stay until closing. After four Thursdays, the council could compare those numbers with the fares collected on the extra run before deciding whether to keep it.\n\nEven a short trial would give the students a chance to be heard.';
  reset();
};

let worker;
let pendingId = 0;

function stopWorker() {
  pendingId++;
  worker?.terminate();
  worker = undefined;
  busy(false);
}

get('cancel').onclick = () => {
  stopWorker();
  get('summary').textContent = get('verdict').hidden ? '已停止分析。' : '已停止逐句检测，保留已完成的结果。';
};

get('run').onclick = () => {
  reset();
  const text = input.value;
  if (!words(text).length) {
    get('summary').textContent = '请至少输入一个英文单词。';
    return;
  }
  let sentences;
  if (get('withSentences').checked) {
    if (typeof Intl.Segmenter !== 'function') {
      get('summary').textContent = '请使用新版浏览器，或取消逐句检测以查看全文分数。';
      return;
    }
    const segmenter = new Intl.Segmenter('en', {granularity:'sentence'});
    sentences = Array.from(segmenter.segment(text), item => item.segment.trim()).filter(Boolean);
  }
  if (location.protocol === 'file:') {
    get('summary').textContent = '请通过网站地址打开 EssayLens，以启用浏览器模型。';
    return;
  }
  if (!navigator.storage?.getDirectory || !window.WebAssembly) {
    get('summary').textContent = '检测需要 WebAssembly 和浏览器本地存储。请使用新版桌面 Edge 或 Chrome。';
    return;
  }
  const id = ++pendingId;
  const completed = new Set();
  busy(true);
  get('summary').textContent = '正在准备浏览器内的检测模型…';
  try {
    if (!worker) worker = new Worker('./score-worker.js?v=5', {type:'module'});
    worker.onmessage = ({data}) => {
      if (data.id !== id || id !== pendingId) return;
      try {
        if (data.type === 'whole') {
          renderWhole(data.result?.score);
          if (sentences) {
            get('sentenceResults').hidden = false;
            get('cancel').textContent = '停止逐句检测';
            get('summary').textContent = '正在逐句检测…';
          }
        } else if (data.type === 'sentence') {
          const {index,row} = data;
          if (!Number.isInteger(index) || !sentences || index < 0 || index >= sentences.length || completed.has(index) ||
              row?.text !== sentences[index] || !validScore(row?.score)) {
            throw new Error('逐句结果与原文不匹配。');
          }
          appendMatch(row, index);
          completed.add(index);
          get('summary').textContent = '已检查 ' + completed.size + ' / ' + sentences.length + ' 句';
        } else if (data.type === 'progress') {
          if (get('verdict').hidden) get('summary').textContent = data.message;
        } else if (data.type === 'error') {
          throw new Error(data.message);
        } else if (data.type === 'done') {
          if (get('verdict').hidden || (sentences && completed.size !== sentences.length)) {
            throw new Error('未收到完整的检测结果。');
          }
          if (sentences) {
            get('sentenceResults').hidden = false;
            get('sentenceEmpty').hidden = get('sentenceList').childElementCount > 0;
          }
          get('summary').textContent = '';
          busy(false);
        }
      } catch (error) {
        stopWorker();
        get('summary').textContent = (get('verdict').hidden ? '分析未完成。' : '逐句检测未完成。') + error.message;
      }
    };
    worker.onerror = () => {
      if (id !== pendingId) return;
      stopWorker();
      get('summary').textContent = '模型未能加载。请使用桌面浏览器，检查网络和可用内存后重试。';
    };
    worker.postMessage({type:'score', id, text, sentences});
  } catch {
    stopWorker();
    get('summary').textContent = '无法启动模型。请使用支持 Web Worker 的桌面浏览器重试。';
  }
};
reset();
</script>
</body>
</html>
